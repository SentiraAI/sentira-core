[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentira-core"
version = "1.8.0"
description = "Codice comune ai prodotti Sentira: auth, email, notifiche, SQLite, consumo AI, chat"
readme = "README.md"
# 3.10 e non 3.11: l'immagine mcr.microsoft.com/playwright/python:v1.49.0-jammy,
# su cui gira lead-hunter-v2 in produzione, porta Python 3.10.12.
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sentira" }]
dependencies = [
    "fastapi",
    "pydantic",
    "httpx",
    "jinja2",
    "markdown",
    "sqlalchemy",
    # 2.15.1: chiude CVE-2026-102266/102272/102273 (confusione di chiave)
    "PyJWT>=2.15.1",
    "cryptography",
    "apscheduler>=3.10,<4",
    # zoneinfo sulle immagini slim: senza, "Europe/Rome" crasha solo in produzione
    "tzdata",
]

[project.urls]
Repository = "https://github.com/SentiraAI/sentira-core"

[tool.setuptools.packages.find]
include = ["sentira_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
